<div class="latest-post">
  <h4 class="widget-label">LATEST POST</h4>

  <div class="post-content">
    <div class="post-tags">
      @for (tag of latestPost.tags; track tag) {
        <span class="tag">{{ tag }}</span>
      }
    </div>
    <h3 class="post-title">{{ latestPost.title }}</h3>
    <p class="post-excerpt">{{ latestPost.excerpt }}</p>
    <div class="post-meta">
      <span class="post-date">{{ latestPost.date }}</span>
      <span class="meta-separator">·</span>
      <span class="post-read-time">{{ latestPost.readTime }}</span>
    </div>
  </div>

  <button class="read-link" (click)="navigateToPost()">
    Read Article
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="5" y1="12" x2="19" y2="12"></line>
      <polyline points="12 5 19 12 12 19"></polyline>
    </svg>
  </button>
</div>
