<div class="quick-launch">
  <h4 class="widget-label">QUICK LAUNCH</h4>

  <div class="launch-grid">
    @for (action of actions; track action.label) {
      <button class="launch-btn" (click)="handleAction(action)">
        <span class="launch-icon">
          @if (action.icon === 'resume') {
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          }
          @if (action.icon === 'terminal') {
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="M6 8l4 4-4 4"></path>
              <line x1="12" y1="16" x2="18" y2="16"></line>
            </svg>
          }
          @if (action.icon === 'projects') {
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              <line x1="12" y1="11" x2="12" y2="17"></line>
              <line x1="9" y1="14" x2="15" y2="14"></line>
            </svg>
          }
          @if (action.icon === 'contact') {
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          }
        </span>
        <span class="launch-label">{{ action.label }}</span>
      </button>
    }
  </div>
</div>

<!-- Terminal Modal -->
@if (showTerminalModal()) {
  <div class="modal-backdrop" (click)="onModalBackdropClick($event)">
    <div class="modal-container">
      <button class="modal-close" (click)="closeTerminalModal()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <app-ask-me></app-ask-me>
    </div>
  </div>
}
