<div class="life-stats">
  <div class="stats-header">
    <h3 class="stats-title">LIFE STATS — LIVE COUNTERS</h3>
  </div>

  <div class="stats-grid">
    @for (stat of stats; track stat.label) {
      <div class="stat-item">
        <div class="stat-icon" [ngClass]="stat.icon">
          @switch (stat.icon) {
            @case ('coffee') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                <line x1="6" y1="1" x2="6" y2="4"></line>
                <line x1="10" y1="1" x2="10" y2="4"></line>
                <line x1="14" y1="1" x2="14" y2="4"></line>
              </svg>
            }
            @case ('bug') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="8" y="6" width="8" height="14" rx="4"></rect>
                <path d="M19 8l-3 2"></path>
                <path d="M5 8l3 2"></path>
                <path d="M19 16l-3-2"></path>
                <path d="M5 16l3-2"></path>
                <path d="M12 2v4"></path>
              </svg>
            }
            @case ('commit') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="4"></circle>
                <line x1="1.05" y1="12" x2="7" y2="12"></line>
                <line x1="17.01" y1="12" x2="22.96" y2="12"></line>
              </svg>
            }
            @case ('code') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="16 18 22 12 16 6"></polyline>
                <polyline points="8 6 2 12 8 18"></polyline>
              </svg>
            }
          }
        </div>
        <div class="stat-value">{{ stat.displayValue() }}</div>
        <div class="stat-label">{{ stat.label }}</div>
      </div>
    }
  </div>
</div>
