<!-- Dev Uptime Section -->
<div class="dev-uptime-section">
  <span class="uptime-label">DEV UPTIME (Total Experience)</span>

  <div class="uptime-content">
    <div class="uptime-stats">
      <span class="uptime-years">{{ devUptimeYears() }}</span>
      <span class="uptime-unit">yrs</span>
      <span class="uptime-days">{{ devUptimeDays() }}</span>
      <span class="uptime-unit">days</span>
    </div>
    <div class="uptime-timer">{{ devUptimeTimer() }}</div>
  </div>

  <div class="uptime-since">
    Since first <span class="console-log">"hello world"</span>
  </div>
</div>
