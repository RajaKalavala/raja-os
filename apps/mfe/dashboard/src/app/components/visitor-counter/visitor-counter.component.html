<div class="visitor-counter">
  <h4 class="widget-label">VISITORS</h4>

  <div class="counter-display">
    @if (isLoading()) {
      <div class="loading-skeleton"></div>
    } @else {
      <span class="counter-value">{{ formattedCount }}</span>
    }
  </div>

  <div class="visitor-info">
    <svg class="globe-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="2" y1="12" x2="22" y2="12"></line>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
    </svg>
    <span class="visitor-text">Total page views</span>
  </div>
</div>
