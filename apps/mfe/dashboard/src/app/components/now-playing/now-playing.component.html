<div class="now-playing">
  <div class="widget-header">
    <span class="widget-label">NOW PLAYING</span>
    @if (isPlaying()) {
      <span class="playing-indicator">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </span>
    }
  </div>

  <div class="track-info">
    <div class="album-art" [class.spinning]="isPlaying()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"></circle>
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M12 2a10 10 0 0 1 10 10"></path>
      </svg>
    </div>

    <div class="track-details">
      <h4 class="track-title">{{ currentTrack.title }}</h4>
      <p class="track-artist">{{ currentTrack.artist }}</p>
    </div>
  </div>

  <!-- Playback Controls -->
  <div class="controls">
    <button class="control-btn" (click)="previousTrack()" title="Previous">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/>
      </svg>
    </button>

    <button class="control-btn play-btn" (click)="togglePlay()" [class.loading]="isLoading()" [class.error]="hasError()" title="Play/Pause">
      @if (isLoading()) {
        <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" stroke-dasharray="31.4" stroke-dashoffset="10"></circle>
        </svg>
      } @else if (hasError()) {
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
      } @else if (isPlaying()) {
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7L8 5z"/>
        </svg>
      }
    </button>

    <button class="control-btn" (click)="nextTrack()" title="Next">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 18l8.5-6L6 6v12zm8.5-6V6h2v12h-2V12z"/>
      </svg>
    </button>
  </div>

  <!-- Progress Bar -->
  <div class="progress-section">
    <div class="progress-bar" (click)="seekTo($event)">
      <div class="progress-fill" [style.width.%]="progress()"></div>
    </div>
    <div class="time-info">
      <span class="current-time">{{ formatTime(currentTime()) }}</span>
      <span class="total-time">{{ formatTime(duration()) }}</span>
    </div>
  </div>

  <!-- Volume Control -->
  <div class="volume-section">
    <svg class="volume-icon" viewBox="0 0 24 24" fill="currentColor">
      @if (volume() === 0) {
        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
      } @else if (volume() < 0.5) {
        <path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>
      } @else {
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      }
    </svg>
    <input
      type="range"
      class="volume-slider"
      min="0"
      max="1"
      step="0.01"
      [value]="volume()"
      (input)="setVolume($event)"
    />
  </div>

  <!-- Track Indicator -->
  <div class="track-indicator">
    @for (track of playlist; track $index) {
      <span
        class="track-dot"
        [class.active]="$index === currentTrackIndex()"
        [title]="track.title"
      ></span>
    }
  </div>
</div>
