<div class="app-layout" [class.landing-mode]="!showSidebar">
  <!-- Mobile Header with Hamburger -->
  <header class="mobile-header" *ngIf="showSidebar && isMobile()">
    <button class="hamburger-btn" (click)="toggleMobileMenu()" aria-label="Toggle menu">
      <svg *ngIf="!isMobileMenuOpen()" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
      <svg *ngIf="isMobileMenuOpen()" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <span class="mobile-title">RajaOS</span>
  </header>

  <!-- Sidebar Overlay (mobile) -->
  <div
    class="sidebar-overlay"
    *ngIf="showSidebar && isMobile() && isMobileMenuOpen()"
    (click)="closeMobileMenu()">
  </div>

  <!-- Sidebar -->
  <app-sidebar
    *ngIf="showSidebar"
    [isOpen]="isMobileMenuOpen()"
    [isMobile]="isMobile()"
    (closed)="closeMobileMenu()">
  </app-sidebar>

  <main class="app-main" [class.full-width]="!showSidebar" [class.mobile-view]="isMobile()">
    <router-outlet></router-outlet>
  </main>
</div>
