<div class="app-layout" [class.landing-mode]="!showSidebar">
  <!-- Mobile Header with Hamburger -->
  <header class="mobile-header" *ngIf="showSidebar && isMobile()">
    <button class="hamburger-btn" (click)="toggleMobileMenu()" aria-label="Toggle menu">
      <svg *ngIf="!isMobileMenuOpen()" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
      <svg *ngIf="isMobileMenuOpen()" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <span class="mobile-title">RajaOS</span>
    <button class="theme-toggle-btn" (click)="toggleTheme()" [attr.aria-label]="themeService.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'">
      <svg *ngIf="themeService.isDarkMode()" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg *ngIf="!themeService.isDarkMode()" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </header>

  <!-- Sidebar Overlay (mobile) -->
  <div
    class="sidebar-overlay"
    *ngIf="showSidebar && isMobile() && isMobileMenuOpen()"
    (click)="closeMobileMenu()">
  </div>

  <!-- Sidebar -->
  <app-sidebar
    *ngIf="showSidebar"
    [isOpen]="isMobileMenuOpen()"
    [isMobile]="isMobile()"
    (closed)="closeMobileMenu()">
  </app-sidebar>

  <main class="app-main" [class.full-width]="!showSidebar" [class.mobile-view]="isMobile()">
    <router-outlet></router-outlet>
  </main>
</div>
